services:
  octoprint:
    build:
      context: ./octoprint
      args:
        PYTHON_VERSION: 3.12-slim-bookworm
        OCTOPRINT_VERSION: ""
    image: jcrespoc311/octoprint
    container_name: octoprint
    restart: unless-stopped
    ports:
      - "80:5000"
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - octoprint:/octoprint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Madrid

  camera-streamer:
    build: ./camera-streamer
    image: jcrespoc311/camera-streamer
    container_name: camera-streamer
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /run/udev:/run/udev:ro
      - /dev/video0:/dev/video0
    tmpfs:
      - /dev/shm:exec
    environment:
      - TZ=Europe/Madrid

volumes:
  octoprint:
